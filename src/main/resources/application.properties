# Application Configuration
spring.application.name=${APP_NAME:user-service}
server.port=${SERVER_PORT:5002}

# Database Configuration
spring.data.mongodb.uri=mongodb+srv://${DB_USER}:${DB_PASSWORD}@${DB_HOST}/${DB_NAME}?retryWrites=true&w=majority&appName=${DB_NAME}
#spring.data.mongodb.uri=mongodb+srv://yoerismits:fErZK1riUFiGmG7m@user-db.gxv8i.mongodb.net/user-db?retryWrites=true&w=majority&appName=user-db

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST}

# Logging Configuration
logging.level.org.springframework.web=DEBUG
logging.level.com.streamingbot=DEBUG
spring.webflux.base-path=/
